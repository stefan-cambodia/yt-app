org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# JDK utilisé par Gradle. Gradle 9.7 ne supporte pas les JDK trop récents
# (un JDK 26 système est refusé). Décommente et adapte au JBR d'Android Studio
# si ton JDK par défaut ne convient pas — NE PAS committer un chemin absolu
# propre à ta machine.
# org.gradle.java.home=/opt/android-studio/jbr
